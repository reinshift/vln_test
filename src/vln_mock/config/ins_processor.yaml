wait_vlm_ready_sec: 5.0
require_vlm_ready: true
instruction_wait_timeout: 2.0
instruction_retry_interval: 0.5
vlm_response_timeout_sec: 10.0
system_prompt: >-
  You are a navigation instruction subtask parser. Convert instructions to a JSON
  array. Each array element is an object with keys: subtask_N (a direction string,
  one of "forward", "backward", "left", "right") and goal (a string target or null).
  Start N from 1 and increment by 1. Respond with JSON only, no extra text.
